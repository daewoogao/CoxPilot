<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoxPilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: nautical chart on the left, a cox's clipboard panel on the right; stacked on phones. */
:root{
  --bg:#eef2f4; --panel:#fbfcfd; --ink:#1b2733; --muted:#5b6b78; --rule:#d3dde4;
  --land:#dfe6d6; --land-edge:#b9c6ad; --water:#bcd5e8; --water-deep:#a6c6df; --island:#e9eedf;
  --accent:#e2702a; --turn:#f0bf2b; --c5k:#2e7a48; --c3k:#2a5ea8; --warm:#c8453b; --mine:#b8327a; --mine2:#7a4cc4; --mine3:#0f8a8a;
  --ok:#2e7a48; --warn:#b7791f; --bad:#c0392b; --chip:#e7edf1; --hilite:rgba(226,112,42,.16);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151c; --panel:#121d26; --ink:#e1e9ef; --muted:#93a4b2; --rule:#25343f;
  --land:#18221b; --land-edge:#2c3a2e; --water:#173449; --water-deep:#12293b; --island:#1f2b21;
  --accent:#f0884a; --turn:#f4cb4a; --c5k:#56b97a; --c3k:#6d9ee8; --warm:#e06a5f; --mine:#e566a8; --mine2:#a888ee; --mine3:#3fc1c1;
  --ok:#56b97a; --warn:#e0a640; --bad:#ec6a5c; --chip:#1b2933; --hilite:rgba(240,136,74,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151c; --panel:#121d26; --ink:#e1e9ef; --muted:#93a4b2; --rule:#25343f;
  --land:#18221b; --land-edge:#2c3a2e; --water:#173449; --water-deep:#12293b; --island:#1f2b21;
  --accent:#f0884a; --turn:#f4cb4a; --c5k:#56b97a; --c3k:#6d9ee8; --warm:#e06a5f; --mine:#e566a8; --mine2:#a888ee; --mine3:#3fc1c1;
  --ok:#56b97a; --warn:#e0a640; --bad:#ec6a5c; --chip:#1b2933; --hilite:rgba(240,136,74,.18); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;margin:0;line-height:1}
.brand span{font-family:var(--f-display);font-size:16px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.regsel{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:5px 8px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
main{flex:1;display:flex;min-height:0}
.mapwrap{position:relative;flex:1.5;min-width:0;min-height:420px;background:var(--land);touch-action:none;overflow:hidden}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.dragging{cursor:grabbing}
.panel{width:420px;max-width:100%;border-left:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;border:0;background:none;padding:12px 2px 10px;cursor:pointer;font-family:var(--f-display);font-size:clamp(12px,3.3vw,18px);font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.callbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:4px 0 8px}
.callbar label{display:inline-flex;gap:6px;align-items:center;font-size:14px}
ol.calls{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.call{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);break-inside:avoid}
.call .cw{display:flex;flex-direction:column;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.call .cw b{font-size:15px;color:var(--ink)}
.call .ct{font-size:14px;line-height:1.4}.call .ct span{color:var(--muted)}
.call .ci{display:inline-block;width:20px;color:var(--accent);font-weight:700}
.call.k-turn .ci{color:var(--c3k)}.call.k-bridge .ci{color:#d98a00}.call.k-move .ci{color:var(--bad,#c0392b)}.call.k-custom .ci{color:var(--mine)}.call.k-hazard .ci{color:#d8322a}
.hazlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}.hazlist li{display:flex;gap:10px;align-items:flex-start;font-size:14px}.hazlist .hi{flex:0 0 26px;text-align:center;color:#d8322a;font-weight:800}.hazlist li>div{flex:1;min-width:0}.hazlist.mine{margin-top:8px}.hazform{display:grid;gap:8px;margin-top:8px}.hazform input{width:100%}
.call.k-mark{opacity:.8}
.rpbar{display:flex;gap:10px;align-items:center;margin:10px 0}.rplist{display:flex;flex-direction:column;gap:4px;margin:8px 0}.rplist .route{text-align:left;display:flex;justify-content:space-between;gap:8px;width:100%;cursor:pointer}
.app[data-view="practice"] main,.app[data-view="practice"] .racectl{display:none!important}
.ppage{flex:1;overflow-y:auto;padding:8px max(16px,env(safe-area-inset-left,0px)) 40px}.ppage>*{max-width:1180px;margin-left:auto;margin-right:auto}
.ppage h2{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:22px;margin:22px auto 6px}.ppage .lead{font-size:15px;color:var(--muted);margin-top:0}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}.skills .skill{margin:0;background:var(--panel)}
.pwater{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;margin:10px auto}.qzs{max-width:760px}
.skill{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin:10px 0}.skill.done{border-left:4px solid var(--c5k)}
.skh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.skill h3{margin:0;font-size:16px}.skd{font-size:13px;color:var(--muted);white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.skill p{margin:6px 0;font-size:14px;line-height:1.4}.skill ul{margin:4px 0 8px;padding-left:20px;font-size:14px;line-height:1.4}.skill li{margin:3px 0}
.skc{display:flex;flex-direction:column;gap:4px;margin:6px 0;font-size:13px;font-style:italic;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px}
.skill .row,.qz .qos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.qz{border-bottom:1px solid var(--rule);padding:8px 0}.qz p{margin:4px 0;font-size:14px}
.btn.qo{text-align:left;font-weight:500}.btn.qo.right{border-color:var(--c5k);color:var(--c5k);font-weight:700}.btn.qo.wrong{border-color:#c0392b;color:#c0392b}.btn.qo:disabled{cursor:default}
.psrc{padding-left:18px}.psrc a{color:var(--accent)}
#p-replay .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.btn.small{padding:4px 8px;font-size:13px}
.addcall .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.lnk{background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:12px;padding:0 4px}
@media print{
  *{overflow:visible!important}
  html,body,.app,main,.panel,.tabbody{height:auto!important;min-height:0!important;display:block!important;position:static!important}
  body *{visibility:hidden}
  #p-calls,#p-calls *{visibility:visible}
  #p-calls{position:absolute!important;left:0;top:0;width:100%;padding:0 12px;background:#fff;color:#000}
  #p-calls .noprint{display:none!important}
  .call .cw,.call .ct span{color:#333}
  .call{padding:3px 0;grid-template-columns:110px 1fr}.call .ct{font-size:12.5px;line-height:1.3}.call .cw{font-size:10.5px}.call .cw b{font-size:13px}
}
.tabbody{flex:1;overflow:auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbody>section{display:flex;flex-direction:column;gap:14px}
.tabbody>section[hidden]{display:none}
h2{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.big{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:4px;padding:10px;border:1px solid var(--rule);border-radius:8px}
.stat .lab{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
input[type=text],input[type=number],select,textarea{border:1px solid var(--rule);background:var(--bg);border-radius:6px;padding:6px 8px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.legs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.leg{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;padding:10px 6px;border-bottom:1px solid var(--rule);cursor:pointer;align-items:start}
.leg:hover{background:var(--chip)}
.leg.on{background:var(--hilite)}
.leg .n{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--muted);line-height:1.1}
.leg .t{font-weight:600;min-width:0}
.leg .m{font-family:var(--f-display);font-weight:600;font-size:20px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.leg .d{grid-column:2/4;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px}
.leg .lp label{display:inline-flex;align-items:center;gap:5px}.leg .lp input{width:64px;padding:3px 6px;font-size:13px}
.turn{grid-column:2/4;margin-top:6px;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.arcline{flex-basis:100%;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.port{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.chip.stbd{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.head{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.tail{background:color-mix(in srgb,var(--c3k) 18%,transparent);color:var(--c3k)}
.player{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--rule);border-radius:10px}
.readout{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.readout div{display:flex;flex-direction:column}
.readout b{font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums;line-height:1.1}
.readout span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
.swatch{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.routes{display:flex;flex-direction:column;gap:6px}
.route{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px}
.route .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.warnlist{margin:0;padding-left:18px;color:var(--bad);font-size:13px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--rule);padding-left:10px}
.callout{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;max-width:min(320px,calc(100% - 24px));background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.callout b{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;display:block;line-height:1.1}
.callout span{font-size:13px;color:var(--muted)}
.overlay-br{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.maplegend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 200px);background:color-mix(in srgb,var(--panel) 88%,transparent);border-radius:8px;padding:5px 9px;font-size:11px;color:var(--ink);pointer-events:none}
.maplegend span{display:inline-flex;align-items:center;gap:4px}
.lgkey{display:none;pointer-events:auto;font:inherit;font-weight:700;background:none;border:0;padding:2px 4px;color:var(--ink);cursor:pointer}
.scalebar{background:color-mix(in srgb,var(--panel) 85%,transparent);border-radius:6px;padding:4px 8px;font-size:11px;font-family:var(--f-mono)}
.scalebar i{display:block;height:5px;border:1.5px solid var(--ink);border-top:0;margin-top:2px}
.windbadge{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:2px 4px;display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.2}
.windbadge .hstep{width:22px;height:22px;min-width:0;padding:0;font-size:13px}
.windbadge .sub{font-size:10px}
.windbadge svg{width:30px;height:30px}
.windbadge{pointer-events:auto}
.hstep{border:1px solid var(--rule);background:var(--bg);border-radius:6px;width:28px;height:34px;cursor:pointer;font-size:20px;line-height:1;font-weight:700}
.zoombtns{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px}
[hidden]{display:none!important}
.zoombtns button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.maptip{position:absolute;z-index:5;max-width:260px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.35;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none}.maptip b{display:block;font-size:14px}.maptip span{color:var(--muted)}
.call .cn{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;margin-right:6px;padding:0 4px;vertical-align:1px}
.zoombtns button{width:36px;height:36px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);cursor:pointer;font-size:18px;font-weight:700}
.taf{font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px;margin:0;overflow-x:auto}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hour{flex:0 0 auto;min-width:74px;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.hour.on{border-color:var(--accent);background:var(--hilite)}
.hour .h{font-size:12px;color:var(--muted);white-space:nowrap}
.hour .w{font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
.hour svg{width:22px;height:22px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.edithint{font-size:13px;background:var(--hilite);border-radius:8px;padding:8px 10px}
@media (min-width:861px){.app{height:100%}main{min-height:0}}
@media (max-width:860px){
  main{flex-direction:column}
  .mapwrap{flex:none;height:46vh;min-height:300px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:1px solid var(--rule)}
  .panel{width:100%;border-left:0;border-top:1px solid var(--rule)}
  .tabbody{overflow:visible}
  .windbadge .hint{display:none}
  .windbadge{padding:2px 4px;gap:4px;font-size:11px}
  .windbadge svg{width:24px!important;height:24px!important}
  .maplegend{max-width:calc(100% - 140px);font-size:10px;gap:2px 8px}
  .lgkey{display:inline}.maplegend:not(.open)>span{display:none}
  .callout{padding:6px 10px}.callout b{font-size:17px}
  #lseg button[data-l="side"]{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* 3D cox view: full-window scene with a dark game-style HUD that reads the same in light and dark themes. */
.v3{position:fixed;inset:0;z-index:100;background:#9cc8ea;color:#fff;font-family:var(--f-body);touch-action:none;user-select:none;-webkit-user-select:none}
.v3[hidden]{display:none}
.v3c,.v3c canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.v3head{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.v3top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:auto}
.v3b,.v3seg button{border:0;background:rgba(14,22,30,.72);color:#fff;border-radius:8px;padding:7px 11px;font:600 14px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.v3b[hidden]{display:none}select.v3b option{color:#111;background:#fff}
.v3pip{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:110px;width:min(30vw,320px);aspect-ratio:16/10;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.35);cursor:pointer;pointer-events:auto}
.v3pip[hidden]{display:none}
.v3mini{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:110px;width:min(30vw,320px);aspect-ratio:16/10;border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.35);overflow:hidden;background:#e4e9dc;cursor:pointer;pointer-events:auto}
.v3mini.big{width:min(52vw,600px)}
.v3mini[hidden]{display:none}
.v3mini svg{width:100%;height:100%;display:block}

const COURSES={};
for(const k of Object.keys(D.courses)){
  const C=D.courses[k];const line=C.line;const c=cum(line);
  const f=C.official/c[c.length-1];
  const turns=C.turns.map((b,i)=>{const pr=project(line,c,b);const cr=pr.dir[0]*(b[1]-pr.q[1])-pr.dir[1]*(b[0]-pr.q[0]);
    return{pos:b,side:cr>0?'port':'starboard',name:C.names?C.names[i]:(k==='3K'&&i>0)?'Island buoy '+i:'Turn '+(i+1),near:(k==='3K'&&i>0)?'Silcox Island':nearestLandmark(b)}});
  COURSES[k]={key:k,line,f,turns,official:C.official,finish:C.finish||D.finish,finishName:C.finishName||'FINISH'};
}
function analyze(pts,ck){
  const C=COURSES[ck];const c=cum(pts);const L=c[c.length-1];const f=C.f;
  const res={len:L*f,raw:L,cum:c,pts,legs:[],turns:[],warnings:[]};
  const sm=(SMOOTH[REG]||{})[ck],arcs=sm&&pts===sm.pts?sm.turns:null;
  const marks=C.turns.map((t,ti)=>{const pr=project(pts,c,t.pos);const cr=pr.dir[0]*(t.pos[1]-pr.q[1])-pr.dir[1]*(t.pos[0]-pr.q[0]);

    const ang=angDiff(hin,hout);const t2={...t,s:pr.s,clear:pr.d*f,actualSide:side,angle:Math.abs(ang),dir:ang<0?'port':'starboard',wrong:side!==t.side,arc:arcs?arcs[ti]:null};
    if(t2.wrong)res.warnings.push(`Passes ${t.name} on the wrong side (keep it to ${t.side}).`);
    else if(t2.clear<4)res.warnings.push(`Only ${t2.clear.toFixed(0)} m from ${t.name}: blades may hit the buoy.`);
    return t2}).sort((a,b)=>a.s-b.s);

  // is not a turn: the leg carries on past it. The marked course keeps one leg per buoy.

    for(let j=1;j<pts.length-1;j++){if(used.has(j)||Math.abs(c[j]-m.s)>150/f)continue;const bend=Math.abs(angDiff(bearing(pts[j-1],pts[j]),bearing(pts[j],pts[j+1])));if(bend>=bb){bb=bend;best=j}}

    const P=x=>pointAt(pts,c,x).p;if(Math.abs(angDiff(bearing(P(m.s-100/f),P(m.s)),bearing(P(m.s),P(m.s+100/f))))>=12)m.bs=m.s;else m.pass=true}

  }

  }

}

/* ---------- hazards along the line: narrow water, shore close, shallows and buoys from the map, plus ones the team marks ---------- */
let HAZ_USER=[];
function rayToShore(p,dx,dy,max=400){let best=max;for(const P of[SHORE,...ISLANDS])for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[j],b=P[i];const ex=b[0]-a[0],ey=b[1]-a[1];const den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)continue;
  const t=((a[0]-p[0])*ey-(a[1]-p[1])*ex)/den,u=((a[0]-p[0])*dy-(a[1]-p[1])*dx)/den;if(t>0&&t<best&&u>=0&&u<=1)best=t}return best}
function placeNear(p,R=450){let best=null,bd=R;for(const [n,x,y,k] of D.labels){if(k==='island'&&!n)continue;const d=dist(p,[x,y]);if(d<bd){bd=d;best=n}}
  for(const b of (D.bridges||[]).filter(x=>!x.fwy))for(const sg of b.segs)for(const q of sg){const d=dist(p,q);if(d<bd*.8){bd=d/.8;best=b.name}}return best}
let _hazKey='',_haz=[];
function hazards(){const an=currentAnalysis();const key=_anKey+JSON.stringify(HAZ_USER);if(key===_hazKey)return _haz;_hazKey=key;const f=an.len/an.raw,out=[];
  // water width every 8 m along the line, measured square to the boat
  const W=[];for(let s=0;s<=an.raw;s+=8/f){const {p,h}=pointAt(an.pts,an.cum,s);const r=h*Math.PI/180,fx=Math.sin(r),fy=Math.cos(r);const pl=rayToShore(p,-fy,fx),sb=rayToShore(p,fy,-fx);W.push({m:s*f,p,port:pl,stbd:sb,w:pl+sb})}
  const runs=(test)=>{const rs=[];let cur=null;for(const w of W){if(test(w)){if(cur&&w.m-cur.m1<80)cur.m1=w.m,cur.pts.push(w);else rs.push(cur={m0:w.m,m1:w.m,pts:[w]})}}return rs.filter(r=>r.m1-r.m0>=24)};
  const NAR=100;
  const nar=runs(w=>w.w<NAR);
  for(const r of nar){const mn=r.pts.reduce((a,b)=>b.w<a.w?b:a);const mid=r.pts[r.pts.length>>1];const before=W.filter(w=>w.m<r.m0&&w.m>r.m0-200);const wb=before.length?Math.min(400,before.reduce((a,b)=>a+b.w,0)/before.length):0;
    const at=placeNear(mid.p);const len=Math.round((r.m1-r.m0)/10)*10;
    out.push({kind:'narrow',m:r.m0,m1:r.m1,p:mid.p,place:at,w:Math.round(mn.w),len,
      title:`Narrow water${at?' near '+at:''}`,
      text:`About ${Math.round(mn.w)} m bank to bank${len>=40?' for '+fmtM(len):''}${wb>mn.w*1.6?`, down from about ${Math.round(wb/10)*10} m`:''}. Hold the middle, small rudder only, no passing side by side.`,
      say:`Narrow water coming. Hold the middle`})}
  const close=runs(w=>w.w>=NAR&&Math.min(w.port,w.stbd)<30);
  for(const r of close){const mn=r.pts.reduce((a,b)=>Math.min(b.port,b.stbd)<Math.min(a.port,a.stbd)?b:a);const side=mn.port<mn.stbd?'port':'starboard';const d=Math.round(Math.min(mn.port,mn.stbd));const at=placeNear(mn.p);
    out.push({kind:'shore',m:r.m0,m1:r.m1,p:mn.p,side,title:`Shore close on your ${side}${at?' near '+at:''}`,text:`This line passes about ${d} m from the shore on your ${side}. Banks shelve and can be shallow or weedy: watch the ${side} blades and give it a little room.`,say:`Shore close on ${side}`})}
  const pt=(P,kind,name,maxD,text,say)=>{const o=sideOf(an,P);if(o.d>maxD||o.s<0||o.s>an.raw)return;const d=Math.round(o.d);out.push({kind,m:o.s*f,p:P,side:o.side,title:`${name} on your ${o.side}`,text:typeof text==='function'?text(o,d):text,say:say||`${name} on ${o.side}`})};
  for(const [n,x,y,k] of D.labels)if(k==='hazard')pt([x,y],'shallow',n==='Shallow'?'Shallow water':n,200,(o,d)=>`Marked on the official map about ${d} m off your ${o.side} side. Stay on the line and don't cut in.`);
  for(const q of D.shallow||[]){if(D.labels.some(l=>l[3]==='hazard'&&dist([l[1],l[2]],q)<150))continue;pt(q,'shallow','Shallow water',150,(o,d)=>`Shallow marker about ${d} m off your ${o.side} side.`)}
  for(const c of D.channel||[])pt(c.p,'buoy',`2-ton ${c.c} channel buoy`,30,(o,d)=>`A big steel buoy ${d<10?'right by your line':'only about '+d+' m off'}, ${o.side} side. It does not move if you hit it: give it room.`,'Channel buoy');
  for(const u of HAZ_USER)pt([u.x,u.y],'user',u.name,300,(o,d)=>`${u.note?u.note.replace(/([^.!?])$/,'$1.')+' ':''}About ${d} m off your ${o.side} side. Marked by your team.`);

  out.sort((a,b)=>a.m-b.m);return _haz=out}

/* ---------- cox call card: calls placed along the active line ---------- */
function strokesAt(an,s){const f=an.len/an.raw;let n=0;an.legs.forEach((l,i)=>{const o=Math.min(s,l.s1)-l.s0;if(o>0)n+=o*f/(legSpeed(i)*60/legRate(i))});return Math.round(n)}
function sideOf(an,P){const pr=project(an.pts,an.cum,P);const cr=pr.dir[0]*(P[1]-pr.q[1])-pr.dir[1]*(P[0]-pr.q[0]);return{s:pr.s,d:pr.d*an.len/an.raw,side:cr>0?'port':'starboard'}}
const hdg=b=>String(Math.round(b)%360).padStart(3,'0')+'°';
let CALLS_USER=[];
const callKey=()=>REG+'_'+S.course;
function buildCalls(an){const f=an.len/an.raw,L=an.raw,out=[];const add=(m,kind,title,text,say)=>{const s=Math.max(0,Math.min(L,m/f));out.push({s,kind,title,text,say:say||title})};
  const opt=LS.get('cp.callopt',{marks:true,moves:true});const l0=an.legs[0];
  add(0,'start','Start',`Rolling start: be at full race pace before the line. Heading ${hdg(l0.bearing)}. Point: ${pointOfAim(an,l0)}.`,'Start. Full pressure, hold your point');
  // landmarks and bridges as you come level with them
  for(const lab of D.labels){if(lab[3]==='water'||lab[3]==='hazard')continue;const o=sideOf(an,[lab[1],lab[2]]);
    if(o.d>600||o.s<60/f||o.s>L-60/f)continue;add(o.s*f,'land',`${lab[0]} on your ${o.side}`,`${lab[0]} is level on your ${o.side} side.`,`${lab[0]} on your ${o.side}`)}
  for(const b of (D.bridges||[]).filter(x=>!x.fwy)){let best=null;for(const sg of b.segs)for(let k=1;k<sg.length;k++)for(let u=0;u<=1;u+=.05){const P=[sg[k-1][0]+(sg[k][0]-sg[k-1][0])*u,sg[k-1][1]+(sg[k][1]-sg[k-1][1])*u];const o=sideOf(an,P);if(o.d<25&&(!best||o.d<best.d))best=o}
    if(!best)continue;const n=b.name.replace(/ Ship Canal/,'').replace(/ Bridge$/,'');
    add(best.s*f-150,'bridge',`${n} Bridge in 150 m`,`Line up for the centre span now and hold it straight. No big rudder under the bridge.`,`${n} bridge in one fifty. Line up the centre span`);
    add(best.s*f,'bridge',`Under ${n} Bridge`,'Hold the line through the span, then find your next point.',`Under ${n}. Hold it`)}
  // turns
  const preOf=(t,li)=>t.arc?Math.max(0,t.arc.pre*f):Math.max(2,Math.round(t.angle/25))*legSpeed(li)*60/legRate(li);
  const postOf=t=>t.arc?Math.max(30,t.arc.post*f):60;
  an.turns.forEach((t,i)=>{const li=i,nx=an.legs[i+1];const m=t.s*f;const pre=preOf(t,li);
    const prev=an.turns[i-1],nxt=an.turns[i+1];const close=prev&&m-250<prev.s*f+postOf(prev);const nextClose=nxt&&nxt.s*f-250<m+postOf(t);
    if(!close)add(m-250,'turn',`${t.name} in 250 m`,`${t.angle>=70?'Big turn':t.angle>=30?'Turn':'Slight bend'} to ${t.dir} coming, ${Math.round(t.angle)}°. Buoy on your ${t.side}. Warn the crew.`,`${t.name} in two fifty. Turn to ${t.dir} coming`);
    add(m-pre,'turn',`Start the turn: ${t.dir}`,t.arc?`Ease the rudder on now, build to a steady ${Math.round(t.arc.r)} m arc. Pressure up on ${t.dir==='port'?'starboard':'port'}.`:`Rudder on now, pressure up on ${t.dir==='port'?'starboard':'port'}, ease ${t.dir}.`,`Turning ${t.dir} now. Pressure ${t.dir==='port'?'starboard':'port'}`);
    if(nx&&nextClose){add(m+postOf(t),'turn',`Out of ${t.name}, straight into ${nxt.name}`,`${nxt.name} next, buoy on your ${nxt.side}. Keep the boat set.`,`Next buoy, ${nxt.name}`)}
    else if(nx){const post=postOf(t);add(m+post,'turn',`Out of ${t.name}`,`Rudder off. New heading ${hdg(nx.bearing)}. Point: ${pointOfAim(an,nx)}.`,`Out of the turn. Rudder off. New point`);
      if(opt.moves&&nx.dist>500&&!nextClose)add(m+post+20,'move','Power 10 out of the turn','Ten strokes to get the speed back after the turn.','Power ten, now')}});
  const moveAt=m=>opt.moves&&(Math.abs(m-an.len/2)<40||(an.len>2500&&Math.abs(m-(an.len-1000))<40));
  if(opt.marks)for(let m=1000;m<an.len-600;m+=1000)if(!moveAt(m))add(m,'mark',`${(m/1000)} km gone`,`${fmtM(an.len-m)} to go.`,`${fmtM(an.len-m).replace(' m','')} to go`);
  if(opt.moves){add(an.len/2,'move','Halfway move','Power 10 for legs. Remind the crew of the plan for the second half.','Halfway. Power ten for legs, now');
    if(an.len>2500)add(an.len-1000,'move','1,000 to go: start the build','Lengthen and lift the pressure; rate up 1 every 250 m.','One thousand to go. Start the build');
    add(an.len-500,'move','500 to go: sprint','Rate up 2. Everything from here.','Five hundred to go. Up two, sprint');
    add(an.len-250,'move','250 to go','Up 2 more. Empty the tank.','Two fifty. Up two more. Everything')}
  for(const h of hazards()){const warn=h.kind==='narrow'?150:100;
    if(h.m>warn+20)add(h.m-warn,'hazard',`${h.title} in ${warn} m`,h.text,`${h.say} in ${warn===150?'one fifty':'one hundred'}`);
    else add(h.m,'hazard',h.title,h.text,h.say);
    if(h.kind==='narrow'&&h.m1-h.m>=60)add(h.m1,'hazard','Water opens up','Through the narrow part. Back to your normal line and steering.','Clear. Water opens up')}
  for(const u of CALLS_USER)if(isFinite(u.m)&&u.text)add(+u.m,'custom',u.text.slice(0,60),u.note||'',u.text);
  add(an.len,'finish','Finish',`${fmtM(an.len)} · plan ${fmtTime(totalTime(an))}.`,'Finish. Well done');
  const br=out.filter(c=>c.kind==='bridge');for(let j=out.length-1;j>=0;j--){const c=out[j];if(c.kind==='move'&&c.title.startsWith('Power 10 out')&&br.some(b=>Math.abs(b.s-c.s)*f<160))out.splice(j,1)}

  for(const c of out){c.m=c.s*f;c.togo=an.len-c.m;c.t=elapsed(an,c.s);c.st=strokesAt(an,c.s)}

const CALLICON={start:'▶',finish:'■',turn:'↻',land:'◆',bridge:'⌒',mark:'—',move:'⚡',custom:'✎',hazard:'⚠'};

/* ---------- GPS race replay: import a boat's GPS file, line it up with the course, and see where time went ---------- */
const RP={list:[],cur:null,t:0,playing:false,raf:0};
function toLocal(lat,lon){const o=D.origin;return[(lon-o.lon)*111320*Math.cos(o.lat*RAD),(lat-o.lat)*110574]}
function parseClock(v,base){v=String(v||'').trim();if(!v)return null;if(/^\d{4}-\d\d-\d\dT/.test(v)){const t=Date.parse(v);return isNaN(t)?null:t/1000}
  const m=v.match(/^(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)$/);if(m)return(+(m[1]||0))*3600+(+m[2])*60+(+m[3]);const n=parseFloat(v);return isFinite(n)?n:null}
function parseTrack(text,fname){const low=fname.toLowerCase();let raw=[];
  if(/\.fit$/.test(low))throw new Error('FIT files are not read yet. Export the piece as GPX, TCX or CSV from your app (NK LiNK, CrewNerd, Strava or Garmin Connect all can).');
  if(/<gpx|<trkpt|<TrainingCenterDatabase/i.test(text)){const doc=new DOMParser().parseFromString(text,'application/xml');
    const tps=[...doc.getElementsByTagName('trkpt'),...doc.getElementsByTagName('rtept')];
    if(tps.length)for(const p of tps){const tm=p.getElementsByTagName('time')[0];const cad=p.getElementsByTagName('*');let r=null;for(const e of cad)if(/cad$/i.test(e.tagName)||/strokerate/i.test(e.tagName))r=+e.textContent;raw.push({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon'),t:tm?Date.parse(tm.textContent)/1000:null,r})}
    else for(const p of doc.getElementsByTagName('Trackpoint')){const g=n=>{const e=p.getElementsByTagName(n)[0];return e?e.textContent:null};if(g('LatitudeDegrees')==null)continue;raw.push({lat:+g('LatitudeDegrees'),lon:+g('LongitudeDegrees'),t:g('Time')?Date.parse(g('Time'))/1000:null,r:g('Cadence')!=null?+g('Cadence'):null})}}
  else{const lines=text.split(/\r?\n/);const split=l=>l.split(/,|;|\t/).map(x=>x.trim().replace(/^"|"$/g,''));let hi=-1,H;
    for(let i=0;i<Math.min(lines.length,200);i++){const c=split(lines[i]).map(x=>x.toLowerCase());if(c.some(x=>/lat/.test(x))&&c.some(x=>/lon|lng/.test(x))){hi=i;H=c;break}}
    if(hi<0)throw new Error('Could not find latitude and longitude columns in this file.');
    const col=re=>H.findIndex(x=>re.test(x));const la=col(/lat/),lo=col(/lon|lng/),ti=col(/elapsed/)>=0?col(/elapsed/):col(/time|timestamp/),ra=col(/stroke ?rate|^rate|spm|cadence/);
    for(let i=hi+1;i<lines.length;i++){const c=split(lines[i]);const lat=parseFloat(c[la]),lon=parseFloat(c[lo]);if(!isFinite(lat)||!isFinite(lon)||(!lat&&!lon))continue;raw.push({lat,lon,t:ti>=0?parseClock(c[ti]):null,r:ra>=0?parseFloat(c[ra]):null})}}
  raw=raw.filter(p=>isFinite(p.lat)&&isFinite(p.lon)&&Math.abs(p.lat)>1);
  if(raw.length<10)throw new Error('This file has too few GPS points to replay.');
  if(raw.some(p=>p.t==null||!isFinite(p.t)))throw new Error('This file has no time for each point, so splits cannot be worked out.');
  const t0=raw[0].t;const pts=[];let last=-1e9;
  for(const p of raw){const t=p.t-t0;if(t-last<1)continue;last=t;const [x,y]=toLocal(p.lat,p.lon);pts.push([+x.toFixed(1),+y.toFixed(1),+t.toFixed(1),isFinite(p.r)&&p.r>0?Math.round(p.r):null])}
  const far=pts.filter(p=>Math.hypot(p[0],p[1])>8000).length;if(far>pts.length/2)throw new Error(`This track is not on ${D.name}. Pick the other regatta at the top and import again.`);
  return{pts,start:raw[0].t>1e9?new Date(raw[0].t*1000).toISOString():null}}
// GPS is accurate to a few metres, but the traced map can be off by tens of metres. Keep the track where the map puts it
// unless that runs it onto land; then move it the least distance that keeps it on the water. A nudge you make becomes the
// starting point for the next file on this regatta.
function lineDist(line,p){let m=1e9;for(let i=1;i<line.length;i++)m=Math.min(m,segDist(p,line[i-1],line[i]));return m}
const onWater=p=>inPoly(p,SHORE)&&!onIsland(p);
function autoShift(pts){const sub=pts.filter((_,i)=>i%Math.max(1,Math.floor(pts.length/300))===0);const base=LS.get('cp.gpsShift.'+REG,[0,0]);
  const land=(dx,dy)=>{let n=0;for(const p of sub)if(!onWater([p[0]+dx,p[1]+dy]))n++;return n};
  let best=base,bc=land(...base)*1000;if(bc===0)return base;
  for(let dx=-80;dx<=80;dx+=4)for(let dy=-80;dy<=80;dy+=4){const sh=[base[0]+dx,base[1]+dy];const c=land(...sh)*1000+Math.hypot(dx,dy);if(c<bc){bc=c;best=sh}}
  return best}
// for a crew that rowed close to the course: slide the track (up to 80 m) so it sits as close as it can to the marked and smooth lines
function fitToCourse(pts,ck){const lines=[COURSES[ck].line];const sm=(SMOOTH[REG]||{})[ck];if(sm)lines.push(sm.pts);const sub=pts.filter((_,i)=>i%Math.max(1,Math.floor(pts.length/200))===0);
  const cost=(dx,dy)=>{const v=sub.map(p=>Math.min(...lines.map(l=>lineDist(l,[p[0]+dx,p[1]+dy])))).sort((a,b)=>a-b);return v[Math.floor(v.length/2)]};
  let best=[0,0],bc=cost(0,0);for(let dx=-80;dx<=80;dx+=8)for(let dy=-80;dy<=80;dy+=8){const c=cost(dx,dy);if(c<bc){bc=c;best=[dx,dy]}}
  for(const st of[4,2,1]){let moved=true;while(moved){moved=false;for(const [ax,ay] of[[st,0],[-st,0],[0,st],[0,-st]]){const c=cost(best[0]+ax,best[1]+ay);if(c<bc){bc=c;best=[best[0]+ax,best[1]+ay];moved=true}}}}return best}
function bestCourse(pts,sh){let b=null;for(const k of Object.keys(COURSES)){const line=COURSES[k].line;const L=cum(line).slice(-1)[0];
  const ss=pts.map(p=>project(line,cum(line),[p[0]+sh[0],p[1]+sh[1]]).s);const cover=(Math.max(...ss)-Math.min(...ss))/L;if(!b||cover>b.cover+.05)b={k,cover}}return b?b.k:S.course}
// the race itself, leg by leg and turn by turn, against the marked course
function replayAnalysis(sess){const ck=sess.course;if(!COURSES[ck])return null;const C=COURSES[ck];const an=analyze(C.line,ck);const f=an.len/an.raw;const sh=sess.shift||[0,0];
  // a light 5-point smoothing so GPS jitter does not add phantom metres
  const Q=sess.pts.map(p=>[p[0]+sh[0],p[1]+sh[1],p[2],p[3]]);const P=Q.map((p,i)=>{let x=0,y=0,n=0;for(let j=Math.max(0,i-2);j<=Math.min(Q.length-1,i+2);j++){x+=Q[j][0];y+=Q[j][1];n++}return[x/n,y/n,p[2],p[3]]});
  // the yardstick is the shortest smooth line where there is one, else the marked line; both measured between the same gates on the marked line
  const sm=(SMOOTH[REG]||{})[ck];const ref=sm?sm.pts:an.pts;const refS=ref.map(q=>project(an.pts,an.cum,q).s);
  const ideal=(a,b)=>{let d=0;for(let i=1;i<ref.length;i++){const lo=Math.max(a,Math.min(refS[i-1],refS[i])),hi=Math.min(b,Math.max(refS[i-1],refS[i]));if(hi<=lo)continue;const span=Math.abs(refS[i]-refS[i-1])||1;d+=dist(ref[i-1],ref[i])*(hi-lo)/span}return d};
  const pr=P.map(p=>project(an.pts,an.cum,p));let ms=0;const s=pr.map(q=>{if(q.s>ms&&q.s-ms<250)ms=q.s;return ms});
  const L=an.raw;
  // start and finish are where the track crosses the start and finish lines (lines stretched 30 m each way); the projection is the fallback
  const xing=(ln,from)=>{if(!ln||ln.length<2)return -1;const a=ln[0],b=ln[ln.length-1],u=[(b[0]-a[0]),(b[1]-a[1])],n=Math.hypot(...u)||1,A=[a[0]-u[0]/n*30,a[1]-u[1]/n*30],B=[b[0]+u[0]/n*30,b[1]+u[1]/n*30];
    const side=p=>(B[0]-A[0])*(p[1]-A[1])-(B[1]-A[1])*(p[0]-A[0]);for(let i=Math.max(1,from);i<P.length;i++){const s1=side(P[i-1]),s2=side(P[i]);if(s1*s2<=0&&s1!==s2){const q=side(P[i-1])/(s1-s2);const X=[P[i-1][0]+(P[i][0]-P[i-1][0])*q,P[i-1][1]+(P[i][1]-P[i-1][1])*q];const v=[X[0]-A[0],X[1]-A[1]];const tt=(v[0]*(B[0]-A[0])+v[1]*(B[1]-A[1]))/((B[0]-A[0])**2+(B[1]-A[1])**2);if(tt>=0&&tt<=1)return i}}return -1};
  let i0=xing(D.start,1);if(i0<0)i0=Math.max(0,s.findIndex(v=>v>2));let i1=xing(C.finish,i0+30);if(i1<0)i1=s.findIndex((v,i)=>i>i0&&v>=L-15/f);const done=i1>=0;if(!done)i1=P.length-1;
  if(done)for(let i=i1;i<s.length;i++)s[i]=Math.max(s[i],L);
  const tAt=x=>{for(let i=Math.max(1,i0);i<=i1;i++)if(s[i]>=x){const a=s[i-1],b=s[i];const u=b>a?(x-a)/(b-a):0;return P[i-1][2]+(P[i][2]-P[i-1][2])*Math.max(0,Math.min(1,u))}return null};
  const pathLen=(ta,tb)=>{let d=0;for(let i=1;i<P.length;i++){if(P[i][2]<=ta||P[i-1][2]>=tb)continue;d+=dist(P[i-1],P[i])}return d};
  const win=(ta,tb,fn)=>{const v=[];for(let i=0;i<P.length;i++)if(P[i][2]>=ta&&P[i][2]<=tb){const x=fn(i);if(x!=null&&isFinite(x))v.push(x)}return v};
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const T0=P[i0][2],T1=P[i1][2];
  const legs=an.legs.map((l,i)=>{const ta=i===0?T0:tAt(l.s0),tb=i===an.legs.length-1&&done?T1:tAt(l.s1-1e-6);if(ta==null||tb==null)return{l,missing:true};
    const time=tb-ta,row=pathLen(ta,tb),plan=ideal(l.s0,l.s1);const off=win(ta,tb,j=>j%2?null:lineDist(ref,P[j]));const rate=win(ta,tb,j=>P[j][3]);
    return{l,ta,tb,time,split:time/(l.dist)*500,row,extra:row-plan,offAvg:avg(off),offMax:off.length?Math.max(...off):null,rate:avg(rate),planTime:elapsed(an,l.s1)-elapsed(an,l.s0)}});
  const turns=an.turns.map(t=>{const a=Math.max(0,t.s-150/f),b=Math.min(L,t.s+150/f);const ta=tAt(a),tb=tAt(b-1e-6);if(ta==null||tb==null)return{t,missing:true};
    const row=pathLen(ta,tb),plan=ideal(a,b);let cl=1e9,ci=-1;for(let i=0;i<P.length;i++)if(P[i][2]>=ta&&P[i][2]<=tb){const d=dist(P[i],t.pos);if(d<cl){cl=d;ci=i}}
    let side=null;if(ci>0){const q=project(an.pts,an.cum,P[ci]);const cr=q.dir[0]*(t.pos[1]-P[ci][1])-q.dir[1]*(t.pos[0]-P[ci][0]);side=cr>0?'port':'starboard'}
    const v=row/((tb-ta)||1);return{t,time:tb-ta,lost:row-plan,lostSec:(row-plan)/v,clear:cl,side,ok:side===t.side}});
  const time=T1-T0;return{an,f,P,s,i0,i1,done,T0,T1,time,split:time/(an.len)*500,row:pathLen(T0,T1),ideal:ideal(0,L),refName:sm?'shortest smooth line':'marked line',legs,turns,plan:totalTime(an)}}
function replayAt(R,t){const P=R.P;let i=1;while(i<P.length-1&&P[i][2]<t)i++;const a=P[i-1],b=P[i];const u=b[2]>a[2]?Math.max(0,Math.min(1,(t-a[2])/(b[2]-a[2]))):0;
  const p=[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];let j=i;while(j>1&&P[j][2]>t-10)j--;let k=i;while(k<P.length-1&&P[k][2]<t+10)k++;let d=0;for(let m=j+1;m<=k;m++)d+=dist(P[m-1],P[m]);const v=d/((P[k][2]-P[j][2])||1);
  return{p,h:bearing(a,b),split:v>.5?500/v:null,rate:b[3]??a[3],idx:i}}
function drawReplay(){const g=$('#replay');if(!g)return;g.innerHTML='';const sess=RP.cur;if(!sess||sess.reg!==REG||sess.course!==S.course||S.tab!=='replay'&&!RP.keep)return;const R=RP.R;if(!R)return;const k=mpp();

  el('path',{d,fill:'none',stroke:'#14181d','stroke-width':2.4,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'},g);
  for(const tr of R.turns)if(!tr.missing&&tr.lost>3){const q=tr.t.pos;el('circle',{cx:q[0],cy:-q[1],r:16*k,fill:'none',stroke:tr.lost>12?'#d8322a':'#e2a21a','stroke-width':2.5,'vector-effect':'non-scaling-stroke'},g)}
  const at=replayAt(R,R.T0+RP.t);el('circle',{cx:at.p[0],cy:-at.p[1],r:7*k,fill:'#14181d',stroke:'#fff','stroke-width':2,'vector-effect':'non-scaling-stroke'},g)}
function setReplay(sess){RP.cur=sess;RP.t=0;RP.playing=false;RP.R=null;if(sess){if(sess.course!==S.course&&COURSES[sess.course])setCourse(sess.course);RP.R=replayAnalysis(sess)}renderReplay();drawReplay()}
function renderReplay(){const el_=$('#p-replay');if(!el_)return;const sess=RP.cur&&RP.cur.reg===REG?RP.cur:null;const R=sess&&RP.R;const mine=RP.list.filter(x=>x.reg===REG);

 {id:'pass',title:'Overtaking a slower crew',drill:'pass',

const BOATL=17.5; // an eight, stern (cox) to bow
function inNarrow(m){return hazards().some(h=>h.kind==='narrow'&&m>=h.m-20&&m<=h.m1+20)}
// the longest stretch of open water on the line, so there is room to pass before narrow water
function drillSpot(an){const f=an.len/an.raw;const nar=hazards().filter(h=>h.kind==='narrow');let segs=[[90,an.len-150]];
  for(const h of nar)segs=segs.flatMap(([x,y])=>h.m1+40<x||h.m-40>y?[[x,y]]:[[x,h.m-40],[h.m1+40,y]].filter(([p,q])=>q-p>60));
  const b=segs.reduce((a,c)=>c[1]-c[0]>a[1]-a[0]?c:a,segs[0]||[90,an.len-150]);
  const kind=V3.drill;const s0m=b[0];const len=kind==='wind'?900:1300;return{s0:s0m/f,end:Math.min(an.len-30,s0m+len)/f,
    ai:kind==='pass'?{kind:'slow',am:s0m+75,lat:0,tlat:0,k:.82}:kind==='yield'?{kind:'fast',am:s0m-55,lat:0,tlat:0,k:1.16}:null}}
function aiPose(an,a){const f=an.len/an.raw;const {p,h}=pointAt(an.pts,an.cum,Math.max(0,a.am)/f);const r=h*RAD;return{x:p[0]+Math.cos(r)*a.lat,y:p[1]-Math.sin(r)*a.lat,h:(h+(a.yaw||0)+360)%360,lh:h}}
function say3(t){if(LS.get('cp.v3speak',false)&&window.speechSynthesis){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}}
function stepAI(m,an,f,pr,off,dt){const a=m.ai,L=BOATL;const pm=pr.s*f;const cr=pr.dir[0]*(m.y-pr.q[1])-pr.dir[1]*(m.x-pr.q[0]);const plat=cr>0?-off:off;m.plat=plat;
  let v=legSpeed(legIdxAt(an,Math.max(0,a.am)/f))*a.k;const sep=Math.abs(a.lat-plat);const ahead=a.am-pm;const over=ahead<L&&ahead>-L;m.cap=0;
  if(a.kind==='fast'){const gap=pm-(a.am+L); // open water between their bow and your stern
    if(a.side==null&&gap<45){const t=an.turns.find(t=>t.s*f>a.am+20);a.side=t&&t.s*f-pm<700?(t.dir==='port'?-1:1):-1;a.tlat=a.side*3}
    if(!a.called&&gap<=25){a.called=m.t||.01;m.away=a.side<0?'starboard':'port';flash3(`Crew behind: “Yield! Move to ${m.away}!”`,`They pass on your ${a.side<0?'port':'starboard'}. Move ${m.away} and keep rowing.`);say3('Yield! Move to '+m.away)}
    if(a.called&&m.clearT==null&&sep>=8&&gap>L*.5){m.clearT=m.t;flash3('Clear ✓',`${Math.round(sep)} m between the boats. Keep rowing and hold your new line.`)}
    if(a.called&&m.clearT==null&&gap<=L*.5&&!m.late){m.late=true;flash3('Too late!',`They are on you. Move to ${m.away} now.`)}
    // they cannot row through you: they sit on your stern until you move
    if(sep<8&&gap<3&&gap>-2){v=Math.min(v,m.v*f);m.block=(m.block||0)+dt}
    if(a.am-(pm+L)>=L&&!m.done){m.passed=true;m.done=true;m.going=false;results3()}}
  else{const gap=a.am-(pm+L); // open water between your bow and their stern
    if(over&&m.overT==null){m.overT=m.t;m.side=plat<a.lat?'port':'starboard';if(!a.called){m.noCall=true;flash3('Call it!','You are overlapping and have not called “Yield!”. Press Y.')}}
    if(over&&inNarrow(pm)&&!m.narrowPass){m.narrowPass=true;flash3('No passing in narrow water!','Wait for open water before you overlap.')}
    if(gap<4&&gap>-3&&sep<6){m.cap=v*.98/f;if(!m.ram){m.ram=true;flash3('Bow on their stern!','Ease off, steer out to the side and pass.')}}else if(gap>8)m.ram=false;
    if(pm-(a.am+L)>=L&&!m.done){m.passT=m.t-(m.overT??m.t);m.passed=true;const t=an.turns.find(t=>t.s*f>pm-40);m.inside=t&&t.s*f-pm<400?((t.dir==='port')===(m.side==='port')):null;m.nextTurn=t;m.done=true;m.going=false;results3()}}

  if(over&&sep<7.5){if(!a.touch){a.touch=true;if(sep<2)m.hull=(m.hull||0)+1;m.clash=(m.clash||0)+1;flash3(sep<2?'Collision!':'Blades clash!',sep<2?'The hulls touched.':'Give the other crew at least 8 m between the boats.')}}else if(sep>8.5)a.touch=false;
  const dl=Math.max(-dt,Math.min(dt,a.tlat-a.lat));a.lat+=dl;a.yaw=dt?Math.atan2(dl/dt,Math.max(1,v))/RAD:0;a.am+=v*dt;a.v=v}
function callYield(){const m=V3.sim;if(!m||!m.ai||m.ai.kind!=='slow'||!m.going||m.done)return;const a=m.ai;if(a.called)return;const an=currentAnalysis(),f=an.len/an.raw;const pm=m.s*f;const gap=a.am-(pm+BOATL);
  if(gap>30){m.early=(m.early||0)+1;flash3('Too early',`They are ${Math.round(gap)} m ahead and can’t hear you yet. Call when you are about a length away.`);return}
  if(inNarrow(pm)||inNarrow(a.am)){m.narrowCall=(m.narrowCall||0)+1;flash3('No passing here','Narrow water: wait for open water before you call.');return}
  const plat=m.plat||0;let side=plat<a.lat-2?1:plat>a.lat+2?-1:0; // they move away from the side you come up on

  if(!side){const t=an.turns.find(t=>t.s*f>a.am);const out=t&&t.s*f-a.am<700?(t.dir==='port'?1:-1):0;side=out&&room(out)-14>=4?out:room(1)>=room(-1)?1:-1}const mv=Math.min(10,room(side)-14);const sn=side>0?'starboard':'port',other=side>0?'port':'starboard';
  if(mv<4){m.noRoom=(m.noRoom||0)+1;flash3(`They have no room to move ${sn}`,`Come up on their ${sn} side instead, or ease off and wait.`);return}
  a.called=m.t||.01;m.callGap=gap;a.tlat=a.lat+side*mv;m.yieldSide=sn;say3('Yield to '+sn);flash3(`“Yield to ${sn}!” They are moving over`,`Pass on their ${other} side. Power ten to walk through.`)}
function drillHud(an,f,s){const m=V3.sim,a=m.ai;const pm=s*f;const sep=Math.round(Math.abs(a.lat-(m.plat||0)));
  if(a.kind==='slow'){const gap=a.am-(pm+BOATL);const over=gap<0&&a.am+BOATL>pm;
    if(over)return[`Overlapping · ${sep} m between boats`,a.called?'Walk through them: power ten, keep at least 8 m away.':'Call “Yield!” now (Y), or back off.'];
    if(gap<0)return['You are past them','Get a length clear before you come back to your line.'];
    return[`Crew ahead: ${Math.round(gap)} m of open water`,a.called?`They are moving to ${m.yieldSide}. Come up on their other side.`:gap>30?'Close up. Set up on the inside of the next turn.':'Within a length: call “Yield!” now (Y).']}
  const gap=pm-(a.am+BOATL);
  if(gap<0)return[`Overlapping · ${sep} m between boats`,sep>=8?'Good, hold it and keep rowing.':`Move to ${m.away||'the side'}: they need 8 m.`];
  return[`Crew behind: ${Math.round(gap)} m`,!a.called?'Keep rowing. Check where they are on the live map and chase view.':m.clearT!=null?'Clear. Hold your line and keep rowing.':`Move to ${m.away} now.`]}
function drillResults(m,an){const f=an.len/an.raw;const tr=(k,v,ok)=>`<tr><td>${k}</td><td class="${ok==null?'':ok?'ok':'bad'}">${v}</td></tr>`;let rows='',head,sum;
  if(m.ai.kind==='slow'){const clean=m.passed&&!m.clash&&!m.narrowPass&&!m.noCall;head=m.aground?'Aground near '+esc(m.aground):m.passed?(clean?'Clean pass ✓':'Passed, with problems'):'Not past yet';
    rows+=tr('Pass',m.passed?`${fmtTime(m.passT)} from overlap to a length clear`:'You did not get past them',m.passed);
    rows+=tr('Yield call',m.ai.called?(m.callGap>=0?`Called with ${Math.round(m.callGap)} m of open water`:'Called after you overlapped'):'Never called',!!m.ai.called&&!m.noCall);
    if(m.early)rows+=tr('Too early',`${m.early} call${m.early>1?'s':''} from too far back`,false);

    if(m.narrowPass)rows+=tr('Narrow water','You overlapped in narrow water: no passing there',false);

  else{const ok=m.clearT!=null&&!m.late&&!m.clash;head=m.aground?'Aground near '+esc(m.aground):ok?'Yielded well ✓':m.passed?'They got past, with problems':'They have not got past yet';
    rows+=tr('Move over',m.clearT!=null?`Clear ${fmtTime(m.clearT-m.ai.called)} after their call${m.late?', but late':''}`:'You did not make room',m.clearT!=null&&!m.late);
    if(m.block)rows+=tr('Blocked them',`${Math.round(m.block)} s sat on your stern (a 60 s penalty in a real race)`,false);
    sum=head}

  rows+=tr('Rudder use',`${Math.round(100*m.rudT/(m.t||1))}% of the row`,m.rudT/(m.t||1)<=.25);
  const L=LS.get('cp.drilllast',{});L[m.drill]=sum;LS.set('cp.drilllast',L);renderPractice();

function place3(cam,view,P,surge,near){const fw=new THREE.Vector3(Math.sin(P.h*RAD),0,-Math.cos(P.h*RAD));
  // a stern cox sits low behind stroke: eyes about 1 m above the water, so stroke's back fills the middle and the rest of the crew is hidden behind
  if(view==='cox'){cam.position.copy(W3(P.x,P.y,1.05+surge)).addScaledVector(fw,-.3);cam.rotation.order='YXZ';cam.rotation.set(-1.5*RAD+surge*.3,-P.h*RAD,0)}
  else if(view==='air'){cam.position.copy(W3(P.x,P.y,70)).addScaledVector(fw,-85);cam.lookAt(W3(P.x,P.y,0).addScaledVector(fw,90))}
  else if(near){cam.position.copy(W3(P.x,P.y,6)).addScaledVector(fw,-16);cam.lookAt(W3(P.x,P.y,0).addScaledVector(fw,12))}
  else{cam.position.copy(W3(P.x,P.y,6.5)).addScaledVector(fw,-19);cam.lookAt(W3(P.x,P.y,0).addScaledVector(fw,16))}}

  for(let i=0;i<pa.length;i+=3){const x=b0[i]+ox,z=b0[i+2]+oz;const u=x*kx+z*kz;pa[i+1]=amp*(Math.sin(u*.9-tt*2.2)+.5*Math.sin((x*.37-z*.61)*1.7-tt*2.9)+.3*Math.sin((x*.8+z*.5)*1.3+tt*1.7))}

  if(V3.rib&&V3.line){const pa=V3.lineObj.geometry.attributes.position.array;let j=0;for(const [x,y,dx,dy] of V3.rib){const hw=.25+Math.hypot(x-P.x,y-P.y)*.006;
      pa[j++]=x-dy*hw;pa[j++]=.32;pa[j++]=-(y+dx*hw);pa[j++]=x+dy*hw;pa[j++]=.32;pa[j++]=-(y-dx*hw)}V3.lineObj.geometry.attributes.position.needsUpdate=true;V3.lineObj.geometry.computeBoundingSphere()}
  if(V3.mark){const bp=W3(P.x,P.y,0);const d=bp.distanceTo(cam.position);const k=Math.max(1,Math.min(14,d/45));V3.mark.visible=d>45;V3.mark.scale.setScalar(k);V3.mark.position.set(bp.x,8+2.6*k,bp.z)}
  // buoys grow with distance so a cox can pick them out like on the water; true size up close
  for(const b of V3.buoys){const d=b.position.distanceTo(cam.position);const k=Math.max(1,Math.min(14,d/45));b.scale.setScalar(k);if(b.userData.r)b.position.y=b.userData.r*.45*k;if(b.userData.lab)b.userData.lab.position.y=b.userData.h*k+2+d*.03}
  // labels fade with distance so the view stays clean
  const cp=cam.position;V3.scene.traverse(o=>{if(o.userData.lm)o.position.y=24+Math.hypot(o.position.x-cp.x,o.position.z-cp.z)*.08;if(o.isSprite&&o!==V3.rainierL)o.visible=o.position.distanceTo(cp)<o.userData.maxD&&(!o.userData.leg||V3.line)});
  V3.r.render(V3.scene,cam);
  // picture in picture: the other camera in a small inset (labels hidden there so it stays readable)
  const pe=$('#v3pip');if(V3.pip&&pe&&!pe.hidden){const cr=V3.r.domElement.getBoundingClientRect(),r=pe.getBoundingClientRect();const x=r.left-cr.left,w=r.width,h=r.height,y=cr.height-(r.top-cr.top)-h;
    if(w>10&&h>10){const pc=V3.pcam;pc.aspect=w/h;pc.updateProjectionMatrix();place3(pc,other,P,surge,true);const vis=[];V3.scene.traverse(o=>{if(o.isSprite&&o.visible){vis.push(o);o.visible=false}});const mk=V3.mark,mv=mk&&mk.visible,ms=mk&&mk.scale.x,my=mk&&mk.position.y;if(mk){const bp=W3(P.x,P.y,0);const d=bp.distanceTo(pc.position);const k=Math.max(1,Math.min(14,d/45));mk.visible=d>45;mk.scale.setScalar(k);mk.position.y=8+2.6*k}
      V3.r.setScissorTest(true);V3.r.setViewport(x,y,w,h);V3.r.setScissor(x,y,w,h);V3.r.render(V3.scene,pc);V3.r.setScissorTest(false);V3.r.setViewport(0,0,cr.width,cr.height);vis.forEach(o=>o.visible=true);if(mk){mk.visible=mv;mk.scale.setScalar(ms);mk.position.y=my}}
    const lab=VIEWNAME[other];if(pe.dataset.l!==lab){pe.dataset.l=lab;pe.querySelector('span').textContent=lab;$('#v3pipsw').textContent=VIEWNAME[pipAlt()]+' ⇄'}}
  if(V3.mode==='ride'&&t-(V3._mp||0)>250){V3._mp=t;updatePlayer()}
  hud3(an,P,w)}

// on the smooth line, tell the cox when to ease into each turn and when to let it off
function arcCue(an,s,li){const f=an.len/an.raw;
  for(const t of an.turns){const a=t.arc;if(!a)continue;const i0=t.s-a.pre,i1=t.s+a.post;
    if(s>=i0-70/f&&s<i0)return` · ${t.dir} turn in ${strokes((i0-s)*f,li)} strokes`;
    if(s>=i0&&s<t.s+a.post*.4)return` · ease into the ${t.dir} turn, steady arc`;
    if(s>=t.s+a.post*.4&&s<i1)return' · let the rudder off gradually'}
  return''}
function hud3(an,P,w){const f=an.len/an.raw,set=(id,v)=>{const e=document.getElementById(id);if(e&&e.textContent!==v)e.textContent=v};
  const ride=V3.mode==='ride';const s=ride?S.pos:V3.sim.s;const li=legIdxAt(an,s);mini3(an,P,li,s);
  set('v3hd',String(Math.round(P.h)%360).padStart(3,'0')+'°');
  const aimP=pointAt(an.pts,an.cum,Math.min(an.raw,s+120/f)).p;const aim=bearing([P.x,P.y],aimP);
  const pr=project(an.pts,an.cum,[P.x,P.y]);const cr=pr.dir[0]*(P.y-pr.q[1])-pr.dir[1]*(P.x-pr.q[0]);const off=pr.d*f;
  const cue=arcCue(an,s,li);
  if(ride){set('v3aim',`Leg ${li+1} of ${an.legs.length} · line ${String(Math.round(an.legs[li].bearing)).padStart(3,'0')}°`+cue);set('v3off','On your line');$('#v3offi').style.left='50%'}
  else{const da=angDiff(P.h,aim);set('v3aim',`Steer ${String(Math.round(aim)%360).padStart(3,'0')}°${Math.abs(da)>=3?(da>0?' · come to starboard':' · come to port'):' · on it'}`+cue);
    set('v3off',off<2?'On your line':`${Math.round(off)} m ${cr>0?'port':'starboard'} of your line`);$('#v3offi').style.left=(50+Math.max(-48,Math.min(48,(cr>0?-1:1)*off*2)))+'%'}
  set('v3w',w.spd?w.label:'Calm');
  if(w.spd){const rel=angDiff(P.h,w.dir);$('#v3warr').setAttribute('transform',`rotate(${rel+180})`);set('v3wrel',Math.abs(rel)<35?'Headwind':Math.abs(rel)>145?'Tailwind':`From ${rel>0?'starboard':'port'}, pushes you to ${rel>0?'port':'starboard'}`)}else set('v3wrel','');
  const sp=ride?legSpeed(li):(V3.sim.v*f);set('v3sp',sp>.3?fmtTime(500/sp)+' /500m':'–');set('v3rt',legRate(li)+' spm');
  set('v3t',fmtTime(V3.simT));set('v3left',fmtM(Math.max(0,an.len-s*f)));
  $('#v3rudi').style.left=(50+(ride?0:V3.sim.rud)*44)+'%';
  $('#v3port').classList.toggle('on',V3.keys.port);$('#v3stbd').classList.toggle('on',V3.keys.stbd);
  const done=V3.sim.done||(ride&&S.pos>=an.raw);set('v3go',done?'Again':V3.sim.going?'Pause':(V3.simT>0?'Go on':'Start'));
  // the call
  let T,Sx;const gone=s*f;const next=an.turns.find(t=>t.s*f>gone-25);
  if(_flash&&performance.now()<_flash.until){T=_flash.t;Sx=_flash.s}
  else if(!V3.sim.going&&V3.simT===0&&V3.sim.drill){T={pass:'Overtake the slower crew ahead',yield:'A faster crew is coming up behind you',wind:'Crosswind: 12 knots from your starboard side'}[V3.sim.drill];
    Sx={pass:'They are about 3 lengths ahead. Close up, set up for the inside of the next turn, call “Yield!” (Y) when you are within a length, then walk through cleanly. Press Start.',
      yield:'Keep rowing and watch for them in the chase view and on the live map. When they call, move over in good time: 8 m between the boats. Press Start.',
      wind:'In this drill the wind pushes the boat. Hold a little rudder against it and keep on your line. Press Start.'}[V3.sim.drill]}
  else if(!V3.sim.going&&V3.simT===0){T=ride?'Ride your planned line':V3.sim.turn?`Practise ${V3.sim.turn.name}: turn to ${V3.sim.turn.dir}, buoy on your ${V3.sim.turn.side}`:'Steer your line';Sx=ride?'Sit in the cox seat and watch the course come at you. Press Start.':'Hold PORT or STARBOARD (or the ← → keys) to move the rudder. It stays where you leave it: tap the rudder bar or press ↓ to centre it. Wind is shown but does not move the boat yet. Press Start.'}
  else if(done){T='Finish';Sx=`${fmtM(an.len)} in ${fmtTime(V3.simT)}`}
  else if(!ride&&V3.sim.ai&&!done){[T,Sx]=drillHud(an,f,s)}
  else if(!ride&&off>25){T=`Off your line by ${Math.round(off)} m`;Sx=`Bring her back to ${cr>0?'starboard':'port'}: steer ${String(Math.round(aim)%360).padStart(3,'0')}°.`}
  else if((()=>{const c=calls().filter(c=>c.m<=gone&&gone-c.m<45&&c.kind!=='start').pop();if(!c)return false;T=c.title;Sx=c.text||'';if(V3.sim.going&&V3._said!==c){V3._said=c;if(LS.get('cp.v3speak',false)&&window.speechSynthesis){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(c.say))}catch(e){}}}return true})()){}
  else if(next){const dm=next.s*f-gone;if(dm<=25){T=`${next.name}: turn to ${next.dir}`;Sx=`Buoy on your ${next.side}. More pressure from ${next.dir==='port'?'starboard':'port'}, ease ${next.dir}.`}
    else{T=`${next.name} in ${fmtM(dm)} · ${strokes(dm,li)} strokes`;Sx=dm<250?`Ready to turn ${next.dir}: ${next.angle>=70?'big':'easy'} turn, buoy on your ${next.side}.`:`Hold your point: ${pointOfAim(an,an.legs[li])}.`}}
  else{const left=an.len-gone;T=`Finish in ${fmtM(left)} · ${strokes(left,an.legs.length-1)} strokes`;Sx=left<500?'Sprint: build the rate to the line.':'Last leg: hold the line to the finish buoys.'}
  set('v3ct',T);set('v3cs',Sx)}

function results3(){const m=V3.sim,an=currentAnalysis();if(m.ai&&!m.aground){drillResults(m,an);return}const f=an.len/an.raw;const plan=m.end!=null?elapsed(an,m.end)-elapsed(an,m.s0):totalTime(an);
  const rows=m.marks.map(b=>{const r=b.res;return`<tr><td>${esc(b.m.name)}</td><td class="${r&&r.ok?'ok':'bad'}">${r?(r.ok?'Correct, on your '+r.side:'Wrong side ('+r.side+')')+` · ${Math.round(r.clear)} m`:(m.aground?'Not reached':'Missed')}</td></tr>`}).join('');
  const avg=m.t?m.off/m.t:0;
  $('#v3res').innerHTML=`<h3>${m.aground?'Aground near '+esc(m.aground):m.turn?esc(m.turn.name)+' practice done':m.drill==='wind'?'Crosswind practice done':m.drill?'Drill over':'Finished'}</h3><table><tr><td>Time</td><td>${fmtTime(m.t)}${m.aground?'':` (plan ${fmtTime(plan)}, ${m.t>plan?'+':'−'}${fmtTime(Math.abs(m.t-plan))})`}</td></tr>
    <tr><td>Off your line</td><td>average ${Math.round(avg)} m, worst ${Math.round(m.offMax)} m</td></tr>
    <tr><td>Rudder use</td><td class="${m.rudT/m.t>.25?'bad':'ok'}">${Math.round(100*m.rudT/(m.t||1))}% of the row${m.rudT/m.t>.25?': every bit of rudder slows the crew':''}</td></tr>
    ${m.hits?`<tr><td>Blade hits</td><td class="bad">${m.hits}</td></tr>`:''}${rows}</table>
    <div class="row" style="margin-top:12px"><button class="v3go" id="v3again">Try again</button><button class="v3b" id="v3close">Close</button></div>`;
  $('#v3res').hidden=false;$('#v3again').onclick=()=>{resetSim()};$('#v3close').onclick=()=>{$('#v3res').hidden=true}}

function ui3(){for(const b of document.querySelectorAll('#v3mode button'))b.setAttribute('aria-pressed',b.dataset.m===V3.mode);
  for(const b of document.querySelectorAll('#v3view button'))b.setAttribute('aria-pressed',b.dataset.v===V3.view);
  for(const b of document.querySelectorAll('#v3spd button'))b.setAttribute('aria-pressed',+b.dataset.s===V3.mult);
  const st=V3.mode==='steer';const fr=$('#v3from');fr.hidden=false;const an=currentAnalysis();
  fr.innerHTML='<option value="-1">Whole course</option>'+an.turns.map((t,i)=>`<option value="${i}">Practise ${esc(t.name)}</option>`).join('')+(st?'<optgroup label="Drills">'+Object.entries(DRILLNAME).map(([k,n])=>`<option value="d:${k}">Drill: ${n}</option>`).join('')+'</optgroup>':'');fr.value=st&&V3.drill?'d:'+V3.drill:String(V3.from);
  $('#v3yield').hidden=!(st&&V3.drill==='pass');
  $('#v3port').hidden=!st;$('#v3stbd').hidden=!st;$('#v3rudw').style.visibility=st?'visible':'hidden';$('#v3offbar').style.display=st?'':'none'}

async function open3(){const box=$('#v3');box.hidden=false;const msg=$('#v3msg');S.playing=false;
  if(!V3.built){msg.hidden=false;msg.textContent='Loading the 3D lake…';try{await load3();build3()}catch(e){msg.textContent='The 3D view could not load here: '+e.message;return}msg.hidden=true}
  const h=selHour();const sky=h&&h.sky&&h.sky.some(c=>c.c==='OVC'||c.c==='BKN');const col=sky?0xb7c2cb:0x9cc8ea;V3.scene.background=new THREE.Color(col);V3.scene.fog=new THREE.Fog(col,500,4200);
  V3.rainier.visible=V3.rainierL.visible=!sky;
  fillRoutes3();buildCourse3();if(!V3.sim||V3._key!==_anKey){V3._key=_anKey;resetSim()}
  requestAnimationFrame(()=>{mini3Build(currentAnalysis());V3.miniLi=-1});
  if(V3.mode==='ride'){V3.simT=elapsed(currentAnalysis(),S.pos)}
  size3();ui3();V3.run=true;V3.last=0;cancelAnimationFrame(V3.raf);V3.raf=requestAnimationFrame(frame3)}
function fillRoutes3(){const e=$('#v3rpick');const cur=S.editing?S.editing.id:S.activeRoute;
  e.innerHTML=`<option value="marked">Marked course</option>`+visibleRoutes().map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('');e.value=cur;e.disabled=!!S.editing}
$('#v3rpick').onchange=e=>{S.activeRoute=e.target.value;S.pos=0;S.leg=-1;S.playing=false;refresh();currentAnalysis();
  buildCourse3();V3._key=_anKey;resetSim();mini3Build(currentAnalysis());V3.miniLi=-1;if(V3.mode==='ride')V3.simT=0;ui3()};
function close3(){V3.run=false;cancelAnimationFrame(V3.raf);$('#v3').hidden=true;V3.keys.port=V3.keys.stbd=false;if(V3.mode==='ride'){updatePlayer()}}

$('#v3d').onclick=open3;$('#v3x').onclick=close3;
$('#v3mode').onclick=e=>{const m=e.target.dataset.m;if(!m||m===V3.mode)return;V3.mode=m;LS.set('cp.v3mode',m);resetSim();ui3()};
$('#v3view').onclick=e=>{const v=e.target.dataset.v;if(v){V3.view=v;ui3()}};
$('#v3spd').onclick=e=>{const s=+e.target.dataset.s;if(s){V3.mult=s;ui3()}};
$('#v3line').onchange=e=>{V3.line=e.target.checked;if(V3.lineObj)V3.lineObj.visible=V3.line;};
$('#v3go').onclick=()=>{const m=V3.sim;const an=currentAnalysis();if(m.done||(V3.mode==='ride'&&S.pos>=an.raw)){resetSim();m.going=false}
  const s=V3.sim;s.going=!s.going;if(s.going&&V3.simT===0)flash3('Attention… Go!','');$('#v3res').hidden=true};
$('#v3reset').onclick=()=>resetSim();
$('#v3pipon').checked=V3.pip;$('#v3pip').hidden=!V3.pip;
$('#v3pipon').onchange=e=>{V3.pip=e.target.checked;LS.set('cp.v3pip',V3.pip);$('#v3pip').hidden=!V3.pip};
$('#v3speak').checked=LS.get('cp.v3speak',false);$('#v3speak').onchange=e=>{LS.set('cp.v3speak',e.target.checked);if(!e.target.checked&&window.speechSynthesis)speechSynthesis.cancel()};
$('#v3othon').checked=V3.others;$('#v3othon').onchange=e=>{V3.others=e.target.checked;LS.set('cp.v3others',V3.others);buildCourse3();if(V3.mini)mini3Build(currentAnalysis())};
$('#v3minion').checked=V3.mini;$('#v3mini').hidden=!V3.mini;
$('#v3minion').onchange=e=>{V3.mini=e.target.checked;LS.set('cp.v3mini',V3.mini);$('#v3mini').hidden=!V3.mini;if(V3.mini)mini3Build(currentAnalysis())};
$('#v3mini').onclick=()=>{$('#v3mini').classList.toggle('big');requestAnimationFrame(()=>{mini3Build(currentAnalysis());V3.miniLi=-1})};
// the inset shows one of the two views the big window is not using; the switch flips between them, a tap on the inset swaps it with the big view
const VIEWNAME={cox:'Cox seat',chase:'Chase',air:'Aerial'};
function pipView(){const o=['cox','chase','air'].filter(v=>v!==V3.view);return o.includes(V3.pipv)?V3.pipv:o[0]}
function pipAlt(){const o=['cox','chase','air'].filter(v=>v!==V3.view);return o.find(v=>v!==pipView())}
V3.pipv=LS.get('cp.v3pipv','chase');
$('#v3pip').onclick=()=>{const was=V3.view;V3.view=pipView();V3.pipv=was;LS.set('cp.v3pipv',was);ui3()};
$('#v3pipsw').onclick=e=>{e.stopPropagation();V3.pipv=pipAlt();LS.set('cp.v3pipv',V3.pipv)};
$('#v3from').onchange=e=>{const v=e.target.value;if(v.startsWith('d:')){V3.drill=v.slice(2);V3.from=-1}else{V3.drill=null;V3.from=+v}resetSim();ui3()};
$('#v3yield').onclick=()=>callYield();
for(const [id,k] of[['#v3port','port'],['#v3stbd','stbd']]){const b=$(id);
  b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture&&b.setPointerCapture(e.pointerId);V3.keys[k]=true};
  b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>{V3.keys[k]=false};b.oncontextmenu=e=>e.preventDefault()}
addEventListener('keydown',e=>{if($('#v3').hidden)return;const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){V3.keys.port=true;e.preventDefault()}else if(k==='ArrowRight'||k==='d'||k==='D'){V3.keys.stbd=true;e.preventDefault()}
  else if(k==='ArrowDown'||k==='s'||k==='S'){V3.centre=true;e.preventDefault()}
  else if(k===' '){$('#v3go').click();e.preventDefault()}else if(k==='c'||k==='C'){V3.view={cox:'chase',chase:'air',air:'cox'}[V3.view]||'cox';ui3()}else if(k==='y'||k==='Y'){callYield();e.preventDefault()}else if(k==='Escape')close3()});
$('#v3rudw').onclick=()=>{V3.centre=true};
addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A')V3.keys.port=false;if(k==='ArrowRight'||k==='d'||k==='D')V3.keys.stbd=false});
</script>
